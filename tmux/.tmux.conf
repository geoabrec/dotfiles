unbind r
bind r source-file ~/.tmux.conf

set-option -g extended-keys on
set -g extended-keys-format csi-u
set-option -g automatic-rename off
set-option -g allow-rename off

unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g window-status-current-format "#W "
set -g window-status-format "#W "

set -g status-position bottom
set -g status-style bg=default,fg=#e87d3e

set -g status-left "#[fg=white] #S | #[fg=white]#H | "
set -g status-left-length 41

set -g status-right "#[fg=white] %H:%M %d-%b-%y "
set -g status-right-length 50

set -g window-status-current-style fg=#6c99bb,bg=default

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tpm'

# Restart Claude Code on restore, resuming the last conversation in that directory
set -g @resurrect-processes '"claude->claude --continue"'

# Restore nvim with `nvim -S` when the pane's directory has a Session.vim
set -g @resurrect-strategy-nvim 'session'

# Off: it reprints the old screen as dead text above the restored program
# set -g @resurrect-capture-pane-contents 'on'

# An empty pane title corrupts resurrect's save file, so never leave one empty
set-hook -g pane-title-changed {
  if -F "#{==:#{pane_title},}" { select-pane -T "#{host_short}" }
}

# Restore the last save automatically when the tmux server starts
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
