# Layout based on radleylewis/zsh (MIT, see ../../zsh/LICENSE.radleylewis)
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$directory$os$git_branch$git_status$nodejs$cpp$python $character"

[os]
disabled = false
format = "[$symbol](blue) "

[os.symbols]
Arch = "󰣇"

[directory]
format            = "[$path](cyan) "
truncation_length = 4
truncate_to_repo  = true

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[nodejs]
symbol = ""
format = "[$symbol $version](green) "

# Off by default in starship; shows the g++ version in C++ folders (learncpp)
[cpp]
disabled = false
symbol = ""
format = "[$symbol $version](blue) "

# Python version, plus the active virtualenv (activate's own prompt prefix is off in .zshrc)
[python]
symbol = ""
format = '[$symbol $version( \($virtualenv\))](yellow) '

[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"
vimcmd_symbol  = "[❮](blue)"
