# kitty config: only the settings that differ from kitty's defaults.
# Full option reference: https://sw.kovidgoyal.net/kitty/conf/
# The BEGIN/END marker blocks are rewritten by `kitten themes` and
# `kitten choose-fonts`; keep the markers so those tools still work.

# BEGIN_KITTY_THEME
# Afterglow
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
font_size	 12
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Cursor: blinking block (-1 = system blink rate), no trail; shell integration leaves its shape alone
cursor_shape block
cursor_blink_interval -1
cursor_trail 0
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0
shell_integration no-cursor

# Window: padding around the text, translucent blurred background
window_padding_width 15
background_opacity 0.90
background_blur 32

# Close the window without asking, even with a program running
confirm_os_window_close 0
